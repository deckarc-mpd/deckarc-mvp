<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1e36"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a2f4a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Gold accent bar top -->
  <rect x="0" y="0" width="1200" height="5" fill="#f5c842"/>

  <!-- Logo mark -->
  <rect x="96" y="180" width="120" height="120" rx="18" fill="#f5c842"/>
  <text x="156" y="267" font-family="Georgia, serif" font-size="60" font-weight="700" fill="#0d1e36" text-anchor="middle">CP</text>

  <!-- Main title -->
  <text x="252" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#ffffff" dominant-baseline="auto">CP360</text>

  <!-- Subtitle -->
  <text x="252" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#94a3b8" font-weight="400">ConstructionProgress360</text>

  <!-- Divider -->
  <rect x="96" y="330" width="480" height="2" rx="1" fill="#1e3a5f"/>

  <!-- Tagline -->
  <text x="96" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34" fill="#f5c842" font-weight="600">Turn today's chaos into tomorrow's plan.</text>

  <!-- Description -->
  <text x="96" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#7c9cba" font-weight="400">Daily operations command center for owner-led residential contractors.</text>

  <!-- Right side decorative element -->
  <circle cx="980" cy="315" r="180" fill="#1a2f4a" opacity="0.5"/>
  <circle cx="980" cy="315" r="120" fill="#1e3a5f" opacity="0.6"/>

  <!-- Hardhat icon simplified -->
  <path d="M 940 280 Q 980 240 1020 280 L 1030 310 L 930 310 Z" fill="#f5c842" opacity="0.9"/>
  <rect x="930" y="308" width="100" height="10" rx="4" fill="#f5c842"/>
  <rect x="970" y="260" width="20" height="20" rx="3" fill="#f5c842"/>

  <!-- Domain text -->
  <text x="96" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#3d6080" font-weight="500">constructionprogress360.com</text>

  <!-- Gold accent bar bottom -->
  <rect x="0" y="625" width="1200" height="5" fill="#f5c842"/>
</svg>
